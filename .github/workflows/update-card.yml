name: Update Agent Card

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node agentsume.js . -o examples/card.svg --weeks 26
      - name: Commit refreshed card
        run: |
          git config user.name "agentsume-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/card.svg
          git diff --cached --quiet || (git commit -m "chore: refresh agent card [skip ci]" && git push)
